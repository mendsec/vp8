name: Update README Badges

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch the required checks on the badge pull request

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Generate Coverage
        run: go test -v ./... -coverprofile=coverage.out -covermode=atomic

      - name: Extract Coverage and Update Badge
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Coverage is $COVERAGE%"
          
          # Determine color based on coverage
          if awk "BEGIN {exit !($COVERAGE >= 80)}"; then
            COLOR="brightgreen"
          elif awk "BEGIN {exit !($COVERAGE >= 60)}"; then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          
          # Replace the Coverage badge URL in README.md
          sed -i 's|!\[Coverage\](https://img.shields.io/badge/Coverage-[^)]*)|![Coverage](https://img.shields.io/badge/Coverage-'"$COVERAGE"'%25-'"$COLOR"')|g' README.md

      - name: Extract Go Version and Update Badge
        run: |
          # Get Go version from go.mod
          GO_VERSION=$(grep "^go " go.mod | awk '{print $2}')
          echo "Go version is $GO_VERSION"
          
          # Replace the Go Version badge URL in README.md
          sed -i 's|!\[Go Version\](https://img.shields.io/badge/Go-[^)]*)|![Go Version](https://img.shields.io/badge/Go-'"$GO_VERSION"'-blue)|g' README.md

      - name: Create Pull Request with Badge Updates
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: auto-update README badges"
          branch: "chore/update-readme-badges"
          title: "docs: auto-update README badges"
          body: "Automatically generated PR to update README badges (Coverage, Go version)."
          base: develop

      # The pull request's commit is pushed with GITHUB_TOKEN, and GitHub does
      # not start workflows for events that token causes, so the checks
      # develop requires would never run and the pull request would stay
      # blocked. workflow_dispatch is the exception to that rule: run the
      # checking workflows on the pull request's branch, and their jobs report
      # on its head commit under the names branch protection expects.
      - name: Run required checks on the badge pull request
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run devsecops.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
