name: Enforce Main Policy

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  enforce-bot-only:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Head Branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "❌ Policy Violation: PRs to 'main' must come from 'develop'."
            echo "All human PRs for features/fixes must be directed to the 'develop' branch."
            exit 1
          fi
          echo "✅ Authorized PR to main from develop"
