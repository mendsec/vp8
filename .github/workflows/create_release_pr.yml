name: Create Release PR (Develop -> Main)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Name / Version (e.g. v1.2.0)'
        required: true

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "🚀 Release ${{ github.event.inputs.version }}" \
            --body "## 🚀 Automated Release PR
            
            This PR was automatically generated by \`github-actions[bot]\` to merge \`develop\` into \`main\`.
            
            **Required**: A human must review and approve this Pull Request before it can be merged."
