name: Create Release PR (Develop -> Main)

on:
  push:
    branches:
      - develop

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      
      - name: Create or Update Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main

          echo "## 🚀 Automated Release PR" > pr_body.txt
          echo "" >> pr_body.txt
          echo "This PR was automatically generated by \`github-actions[bot]\` to merge \`develop\` into \`main\`." >> pr_body.txt
          echo "" >> pr_body.txt
          echo "### 📝 Changelog" >> pr_body.txt
          git log origin/main..origin/develop --no-merges --pretty=format:"* %s (%h)" >> pr_body.txt
          echo "" >> pr_body.txt
          echo "" >> pr_body.txt
          echo "**Required**: A human must review and approve this Pull Request before it can be merged." >> pr_body.txt
          
          PR_EXISTS=$(gh pr list --base main --head develop --state open --json number -q '.[0].number')
          
          if [ -n "$PR_EXISTS" ]; then
            echo "Updating existing PR #$PR_EXISTS"
            gh pr edit $PR_EXISTS --title "🚀 Release: Develop -> Main" --body-file pr_body.txt
          else
            echo "Creating new PR"
            gh pr create \
              --base main \
              --head develop \
              --title "🚀 Release: Develop -> Main" \
              --body-file pr_body.txt
          fi
